name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Build frontend
        run: npm run build

  # Two Rust jobs rather than one, because they need different things and the
  # serial version spent 24 minutes compiling the same crates three times over.
  # mosh-core knows nothing about Tauri, so it needs neither the frontend build
  # nor Tauri's dependency tree — running it alongside the shell roughly halves
  # wall clock.
  core:
    name: Rust core (mosh-core + mosh-probe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Only for `npm run moss:prepare` below — the adapter tests dlopen the
      # library, so it has to exist even though nothing here links Tauri.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: moss/go.sum

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mosh-core
            mosh-probe
          # Restore on every run, but only pay the (multi-minute) compress-and-
          # upload on main. A PR reads main's cache and skips writing its own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      # The adapter tests resolve the library relative to the crate root, so it
      # must sit at src-tauri/moss-runtime/moss.dll even for this job.
      - name: Build Moss shared library
        run: npm run moss:prepare

      - name: Rustfmt check
        run: |
          cargo fmt --manifest-path mosh-core/Cargo.toml --check
          cargo fmt --manifest-path mosh-probe/Cargo.toml --check

      - name: Clippy (deny warnings)
        run: |
          cargo clippy --manifest-path mosh-core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path mosh-probe/Cargo.toml --all-targets -- -D warnings

      # Deliberately NOT nextest. These ~40 Moss tests serialise through the
      # in-process MOSS_TEST_LOCK, which process-per-test isolation defeats —
      # several real loopback handshakes racing each other is exactly what makes
      # them flaky. One process, one lock, one at a time.
      - name: Cargo test (adapters)
        run: cargo test --manifest-path mosh-core/Cargo.toml

  shell:
    name: Rust shell (src-tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: moss/go.sum

      # Install the toolchain pinned by rust-toolchain.toml (channel +
      # rustfmt/clippy components) so CI lints match local exactly.
      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      # tauri::generate_context! requires the frontend dist/ to exist at compile
      # time, so build the frontend before any cargo step.
      - name: Build frontend (dist for generate_context!)
        run: npm run build

      # Build the Moss shared library so the runtime-loading tests can find it
      # at src-tauri/moss-runtime/moss.dll regardless of test ordering.
      - name: Build Moss shared library
        run: npm run moss:prepare

      - name: Rustfmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # nextest runs each test in its own process (isolating the Moss runtime's
      # process-global state) and retries flaky loopback handshakes per the ci
      # profile in src-tauri/.config/nextest.toml.
      - name: Cargo test (nextest)
        run: cargo nextest run --profile ci --manifest-path src-tauri/Cargo.toml
