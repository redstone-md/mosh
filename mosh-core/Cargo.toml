[package]
name = "mosh-core"
version = "0.7.3"
description = "Tauri-free core adapters for Mosh (crypto, transport, persistence, runtimes)"
authors = ["Mosh contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libloading = "0.9"
keyring = "4.0"
keyring-core = "1.0"
openmls_rust_crypto = "0.5.1"
openmls_basic_credential = "0.5.0"
openmls_traits = "0.5.0"
openmls = { version = "0.8.1", features = ["openmls_rust_crypto"] }
url = '2'
aes-gcm = "0.10"
redb = "2"
sha2 = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
mime_guess = "2"
if-addrs = "0.15.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_Foundation", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
